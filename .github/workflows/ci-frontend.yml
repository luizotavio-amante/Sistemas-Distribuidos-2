
name: CI - Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.e2e.yaml"
      - "scripts/e2e.ps1"
      - ".github/workflows/ci-frontend.yml"

  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.e2e.yaml"
      - "scripts/e2e.ps1"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Biome, Vitest, Build e Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Run Unit and Integration Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start E2E Services
        working-directory: .
        run: docker compose -f docker-compose.e2e.yaml -p lab-e2e up -d --build --wait

      - name: Apply Database Migrations
        working-directory: .
        run: docker compose -f docker-compose.e2e.yaml -p lab-e2e exec -T api poetry run alembic upgrade head

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          E2E_ISOLATED: "true"

      - name: Stop E2E Services
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.e2e.yaml -p lab-e2e down -v --remove-orphans

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
