services:
  
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
      - db    

  db:
    image: postgress:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app  
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:            